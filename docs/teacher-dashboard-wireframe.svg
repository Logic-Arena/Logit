        <text x="340" y="25" class="h3">58</text>
        <rect x="420" y="5" width="64" height="28" rx="14" fill="#FEE2E2"/>
        <text x="436" y="25" style="font: 700 12px system-ui; fill:#DC2626;">주의</text>
        <rect x="512" y="5" width="62" height="28" rx="14" fill="#1D4ED8"/>
        <text x="527" y="25" class="white">지도</text>
