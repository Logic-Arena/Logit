<svg width="1600" height="1050" viewBox="0 0 1600 1050" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Teacher dashboard wireframe for Logit Edu</title>
  <desc id="desc">A product wireframe showing the teacher dashboard with class metrics, student status table, competency heatmap, and recommended coaching actions.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0B1220" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="header" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <style>
      .h1 { font: 800 31px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F172A; }
      .h2 { font: 800 21px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F172A; }
      .h3 { font: 700 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F172A; }
      .body { font: 500 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .small { font: 500 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748B; }
      .tiny { font: 600 11px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748B; }
      .white { font: 700 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: white; }
      .number { font: 800 34px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F172A; }
      .blue { fill: #1D4ED8; }
      .green { fill: #0F766E; }
      .orange { fill: #D97706; }
      .red { fill: #DC2626; }
      .muted { fill: #E2E8F0; }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="#EEF2F7"/>
  <rect x="70" y="56" width="1460" height="938" rx="30" fill="white" filter="url(#softShadow)"/>

  <rect x="70" y="56" width="1460" height="86" rx="30" fill="url(#header)"/>
  <rect x="70" y="112" width="1460" height="30" fill="url(#header)"/>
  <text x="112" y="108" style="font: 800 26px system-ui; fill: white;">Logit Edu Teacher Console</text>
  <text x="1252" y="108" class="white">중학교 2학년 A반 · 28명</text>

  <g transform="translate(110 178)">
    <text x="0" y="0" class="h1">선생님 관리 대시보드 MVP</text>
    <text x="0" y="32" class="body">학생별 역량 상태, 위험 신호, 추천 지도 액션을 한 화면에서 확인하는 운영 화면</text>
  </g>

  <g transform="translate(110 250)">
    <rect width="325" height="130" rx="20" fill="#F8FAFC" stroke="#DCE3EE"/>
    <text x="24" y="36" class="body">학급 평균 점수</text>
    <text x="24" y="82" class="number">76</text>
    <text x="84" y="82" class="body">/ 100</text>
    <path d="M226 89c18-44 39-62 72-71" stroke="#1D4ED8" stroke-width="8" stroke-linecap="round"/>
    <text x="222" y="110" class="small">전월 대비 +8%</text>
  </g>

  <g transform="translate(455 250)">
    <rect width="325" height="130" rx="20" fill="#F8FAFC" stroke="#DCE3EE"/>
    <text x="24" y="36" class="body">지도 필요 학생</text>
    <text x="24" y="82" class="number">6</text>
    <text x="62" y="82" class="body">명</text>
    <rect x="218" y="31" width="76" height="76" rx="18" fill="#FEF3C7"/>
    <path d="M256 48l28 48h-56l28-48Z" fill="#D97706"/>
    <circle cx="256" cy="82" r="4" fill="#FEF3C7"/>
  </g>

  <g transform="translate(800 250)">
