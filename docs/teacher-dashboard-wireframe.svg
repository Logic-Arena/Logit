  <g transform="translate(110 800)">
    <rect width="430" height="130" rx="22" fill="#0F172A"/>
    <text x="26" y="40" style="font: 800 20px system-ui; fill: white;">추천 지도 큐</text>
    <text x="26" y="72" class="white">1. 근거 부족 학생에게 자료 인용 훈련 배정</text>
    <text x="26" y="100" class="white">2. 공감 점수 낮은 학생에게 반대 입장 요약 과제</text>
  </g>

  <g transform="translate(565 800)">
    <rect width="430" height="130" rx="22" fill="#F8FAFC" stroke="#DCE3EE"/>
    <text x="26" y="40" class="h2">학생 상세 패널</text>
    <text x="26" y="72" class="body">최근 발언, AI 조언, 약점 원인, 다음 과제를 연결</text>
    <text x="26" y="102" class="small">예: "근거는 있으나 출처/사례가 구체적이지 않음"</text>
  </g>

  <g transform="translate(1020 800)">
