        <text x="340" y="25" class="h3">88</text>
        <rect x="420" y="5" width="64" height="28" rx="14" fill="#DCFCE7"/>
        <text x="436" y="25" style="font: 700 12px system-ui; fill:#0F766E;">양호</text>
        <rect x="512" y="5" width="62" height="28" rx="14" fill="#E2E8F0"/>
        <text x="527" y="25" style="font: 700 12px system-ui; fill:#334155;">보기</text>
      </g>

      <line x1="0" y1="226" x2="598" y2="226" stroke="#E2E8F0"/>

