        <rect x="106" y="0" width="44" height="34" rx="8" fill="#FEE2E2"/>
        <rect x="178" y="0" width="44" height="34" rx="8" fill="#FEF3C7"/>
        <rect x="250" y="0" width="44" height="34" rx="8" fill="#FEF3C7"/>
        <rect x="322" y="0" width="44" height="34" rx="8" fill="#DCFCE7"/>
        <rect x="394" y="0" width="44" height="34" rx="8" fill="#DCFCE7"/>
